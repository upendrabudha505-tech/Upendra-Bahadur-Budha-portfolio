    <rect x="768" y="0" width="234" height="148" rx="20" fill="#0B1626" stroke="#1E293B" stroke-width="1.5" />
    <text x="792" y="40" font-family="sans-serif" font-size="15" fill="#94A3B8">NEPSE Index</text>
    <text x="792" y="84" font-family="sans-serif" font-size="28" font-weight="900" fill="#FFFFFF">2,845.73</text>
    <text x="792" y="118" font-family="sans-serif" font-size="14" fill="#34D399">▲ 1.42%</text>
