<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="1200" height="860">
  <rect width="1200" height="860" fill="#F8FAFC" />

  <!-- ROW 1: SCREENS 1, 2, 3 -->
  <!-- Screen 1: Splash / Login -->
  <g transform="translate(45, 20)">
    <text x="155" y="18" font-family="sans-serif" font-size="15" font-weight="700" fill="#334155" text-anchor="middle">Screen 1 – Splash / Login</text>
    <rect x="0" y="30" width="310" height="365" rx="28" fill="#FFFFFF" stroke="#0F172A" stroke-width="5" />
    <rect x="115" y="40" width="80" height="5" rx="2.5" fill="#0F172A" />
    <text x="155" y="82" font-family="sans-serif" font-size="18" font-weight="800" fill="#0F172A" text-anchor="middle">🏠 SMART HOME</text>
    <text x="155" y="102" font-family="sans-serif" font-size="11.5" font-weight="700" fill="#0284C7" text-anchor="middle">Your Home, Smarter &amp; Safer</text>
    <rect x="20" y="120" width="270" height="28" rx="6" fill="#F8FAFC" stroke="#CBD5E1" />
    <text x="30" y="138" font-family="sans-serif" font-size="11" fill="#94A3B8">✉️ Email / Username</text>
    <rect x="20" y="156" width="270" height="28" rx="6" fill="#F8FAFC" stroke="#CBD5E1" />
    <text x="30" y="174" font-family="sans-serif" font-size="11" fill="#94A3B8">🔑 Password ••••••</text>
    <rect x="20" y="192" width="270" height="30" rx="8" fill="#0284C7" />
    <text x="155" y="211" font-family="sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">LOGIN</text>
    <text x="155" y="238" font-family="sans-serif" font-size="10.5" fill="#0284C7" text-anchor="middle">Forgot Password?</text>
    <rect x="20" y="248" width="270" height="28" rx="8" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.5" />
    <text x="155" y="266" font-family="sans-serif" font-size="11" font-weight="700" fill="#0284C7" text-anchor="middle">CREATE ACCOUNT</text>
    <rect x="20" y="284" width="270" height="28" rx="8" fill="#F8FAFC" stroke="#CBD5E1" />
    <text x="155" y="302" font-family="sans-serif" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">G  Continue with Google</text>
  </g>

  <!-- Screen 2: Home Dashboard -->
  <g transform="translate(445, 20)">
    <text x="155" y="18" font-family="sans-serif" font-size="15" font-weight="700" fill="#334155" text-anchor="middle">Screen 2 – Home Dashboard</text>
    <rect x="0" y="30" width="310" height="365" rx="28" fill="#FFFFFF" stroke="#0F172A" stroke-width="5" />
    <rect x="115" y="40" width="80" height="5" rx="2.5" fill="#0F172A" />
    <text x="20" y="68" font-family="sans-serif" font-size="13" font-weight="800" fill="#0F172A">Good Morning, Alex 👋</text>
    <rect x="18" y="78" width="274" height="28" rx="10" fill="#06B6D4" />
    <text x="155" y="96" font-family="sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">🟢 HOME IS SAFE</text>
    <rect x="18" y="114" width="86" height="38" rx="8" fill="#F8FAFC" stroke="#E2E8F0" />
    <text x="61" y="144" font-family="sans-serif" font-size="12" font-weight="800" fill="#0F172A" text-anchor="middle">🌡️ 24°C</text>
    <rect x="112" y="114" width="86" height="38" rx="8" fill="#F8FAFC" stroke="#E2E8F0" />
    <text x="155" y="144" font-family="sans-serif" font-size="12" font-weight="800" fill="#0F172A" text-anchor="middle">💧 55%</text>
    <rect x="206" y="114" width="86" height="38" rx="8" fill="#F8FAFC" stroke="#E2E8F0" />
    <text x="249" y="144" font-family="sans-serif" font-size="12" font-weight="800" fill="#0F172A" text-anchor="middle">⚡ 3.2 kWh</text>
    <rect x="18" y="160" width="132" height="26" rx="6" fill="#F8FAFC" stroke="#E2E8F0" />
    <text x="26" y="177" font-family="sans-serif" font-size="11" fill="#0F172A">💡 Lights</text>
    <circle cx="134" cy="173" r="7" fill="#22C55E" />
    <rect x="160" y="160" width="132" height="26" rx="6" fill="#F8FAFC" stroke="#E2E8F0" />
    <text x="168" y="177" font-family="sans-serif" font-size="11" fill="#0F172A">🌀 Fan</text>
    <circle cx="276" cy="173" r="7" fill="#94A3B8" />
    <rect x="18" y="192" width="132" height="26" rx="6" fill="#F8FAFC" stroke="#E2E8F0" />
    <text x="26" y="209" font-family="sans-serif" font-size="11" fill="#0F172A">❄️ AC</text>
    <circle cx="134" cy="205" r="7" fill="#22C55E" />
    <rect x="160" y="192" width="132" height="26" rx="6" fill="#F8FAFC" stroke="#E2E8F0" />
    <text x="168" y="209" font-family="sans-serif" font-size="11" fill="#0F172A">🚪 Door <tspan fill="#16A34A" font-weight="700">Locked</tspan></text>
    <rect x="18" y="226" width="274" height="26" rx="6" fill="#F8FAFC" stroke="#E2E8F0" />
    <text x="26" y="243" font-family="sans-serif" font-size="11" fill="#0F172A">Security: <tspan fill="#16A34A" font-weight="700">🟢 All Normal</tspan></text>
    <rect x="18" y="260" width="274" height="38" rx="8" fill="#F5F3FF" stroke="#DDD6FE" />
    <text x="28" y="276" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#4C1D95">🤖 AI tip: Energy usage is higher than</text>
    <text x="28" y="290" font-family="sans-serif" font-size="10.5" fill="#4C1D95">yesterday. Turn off unused appliances.</text>
  </g>

  <!-- Screen 3: Security -->
  <g transform="translate(845, 20)">
    <text x="155" y="18" font-family="sans-serif" font-size="15" font-weight="700" fill="#334155" text-anchor="middle">Screen 3 – Security</text>
    <rect x="0" y="30" width="310" height="365" rx="28" fill="#FFFFFF" stroke="#0F172A" stroke-width="5" />
    <rect x="115" y="40" width="80" height="5" rx="2.5" fill="#0F172A" />
    <text x="20" y="68" font-family="sans-serif" font-size="13" font-weight="800" fill="#0F172A">Security Center</text>
    <rect x="18" y="76" width="274" height="48" rx="10" fill="#334155" />
    <text x="155" y="105" font-family="sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">📹 LIVE CAMERA   <tspan fill="#EF4444">● REC</tspan></text>
    <rect x="18" y="132" width="274" height="24" rx="6" fill="#F8FAFC" stroke="#E2E8F0" />
    <text x="26" y="148" font-family="sans-serif" font-size="11" fill="#0F172A">🚪 Front Door — <tspan fill="#16A34A" font-weight="700">🔒 LOCKED</tspan></text>
    <rect x="18" y="162" width="274" height="24" rx="6" fill="#F8FAFC" stroke="#E2E8F0" />
    <text x="26" y="178" font-family="sans-serif" font-size="11" fill="#0F172A">Motion Sensor — <tspan fill="#16A34A" font-weight="700">🟢 No Motion</tspan></text>
    <rect x="18" y="192" width="274" height="24" rx="6" fill="#F8FAFC" stroke="#E2E8F0" />
    <text x="26" y="208" font-family="sans-serif" font-size="11" fill="#0F172A">Windows — <tspan fill="#16A34A" font-weight="700">🟢 Secure</tspan></text>
    <rect x="18" y="224" width="274" height="28" rx="8" fill="#DC2626" />
    <text x="155" y="242" font-family="sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">🚨 SOS</text>
  </g>

  <!-- ROW 2: SCREENS 4, 5, 6 -->
  <!-- Screen 4: Energy -->
  <g transform="translate(45, 435)">
