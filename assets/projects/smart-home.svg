    <text x="28" y="114" font-family="sans-serif" font-size="15" font-weight="800" fill="#0F172A">3.2 kWh</text>
    <rect x="162" y="78" width="130" height="44" rx="8" fill="#F8FAFC" stroke="#E2E8F0" />
    <text x="172" y="95" font-family="sans-serif" font-size="10" fill="#64748B">This Week</text>
    <text x="172" y="114" font-family="sans-serif" font-size="15" font-weight="800" fill="#0F172A">21.8 kWh</text>
    <!-- Bar Chart -->
    <rect x="45" y="155" width="16" height="32" rx="3" fill="#7DD3FC" />
    <rect x="75" y="142" width="16" height="45" rx="3" fill="#7DD3FC" />
    <rect x="105" y="150" width="16" height="37" rx="3" fill="#7DD3FC" />
    <rect x="135" y="136" width="16" height="51" rx="3" fill="#7DD3FC" />
    <rect x="165" y="146" width="16" height="41" rx="3" fill="#7DD3FC" />
    <rect x="195" y="132" width="16" height="55" rx="3" fill="#0284C7" />
    <rect x="225" y="152" width="16" height="35" rx="3" fill="#7DD3FC" />
    <text x="20" y="218" font-family="sans-serif" font-size="11" fill="#334155">AC 42%  |  Kitchen 25%  |  Lights 18%</text>
    <rect x="18" y="336" width="274" height="30" rx="8" fill="#0284C7" />
    <text x="155" y="355" font-family="sans-serif" font-size="11.5" font-weight="800" fill="#FFFFFF" text-anchor="middle">OPTIMIZE ENERGY</text>
  </g>

  <!-- Screen 5: Automation -->
