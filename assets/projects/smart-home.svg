    <rect x="18" y="80" width="274" height="76" rx="10" fill="#F8FAFC" stroke="#E2E8F0" />
    <text x="28" y="98" font-family="sans-serif" font-size="11" font-weight="800" fill="#0F172A">Automation 1</text>
    <text x="28" y="113" font-family="sans-serif" font-size="10.5" fill="#475569">IF Motion detected → Turn ON hallway light</text>
    <rect x="28" y="124" width="254" height="22" rx="6" fill="#0284C7" />
    <text x="155" y="139" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#FFF" text-anchor="middle">SAVE</text>

    <rect x="18" y="166" width="274" height="76" rx="10" fill="#F8FAFC" stroke="#E2E8F0" />
    <text x="28" y="184" font-family="sans-serif" font-size="11" font-weight="800" fill="#0F172A">Automation 2</text>
    <text x="28" y="199" font-family="sans-serif" font-size="10.5" fill="#475569">IF Temperature &gt; 28°C → Turn ON fan</text>
    <rect x="28" y="210" width="254" height="22" rx="6" fill="#0284C7" />
    <text x="155" y="225" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#FFF" text-anchor="middle">SAVE</text>

    <rect x="18" y="252" width="274" height="76" rx="10" fill="#F8FAFC" stroke="#E2E8F0" />
    <text x="28" y="270" font-family="sans-serif" font-size="11" font-weight="800" fill="#0F172A">Automation 3</text>
    <text x="28" y="285" font-family="sans-serif" font-size="10.5" fill="#475569">IF Nobody is home → Activate Security Mode</text>
    <rect x="28" y="296" width="254" height="22" rx="6" fill="#0284C7" />
    <text x="155" y="311" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#FFF" text-anchor="middle">SAVE</text>
  </g>

  <!-- Screen 6: Notifications -->
  <g transform="translate(845, 435)">
    <text x="155" y="18" font-family="sans-serif" font-size="15" font-weight="700" fill="#334155" text-anchor="middle">Screen 6 – Notifications</text>
    <rect x="0" y="30" width="310" height="365" rx="28" fill="#FFFFFF" stroke="#0F172A" stroke-width="5" />
    <text x="20" y="68" font-family="sans-serif" font-size="13" font-weight="800" fill="#0F172A">Notifications</text>
    <rect x="18" y="80" width="274" height="44" rx="8" fill="#FEF2F2" stroke="#FECACA" />
    <text x="28" y="98" font-family="sans-serif" font-size="11" font-weight="800" fill="#DC2626">🔴 EMERGENCY · now</text>
    <text x="28" y="114" font-family="sans-serif" font-size="10.5" fill="#334155">Smoke detected in kitchen</text>

    <rect x="18" y="132" width="274" height="44" rx="8" fill="#FFFBEB" stroke="#FDE68A" />
    <text x="28" y="150" font-family="sans-serif" font-size="11" font-weight="800" fill="#D97706">⚠️ WARNING · 2 min</text>
    <text x="28" y="166" font-family="sans-serif" font-size="10.5" fill="#334155">Unusual gas level detected</text>

    <rect x="18" y="184" width="274" height="44" rx="8" fill="#EFF6FF" stroke="#BFDBFE" />
    <text x="28" y="202" font-family="sans-serif" font-size="11" font-weight="800" fill="#2563EB">🔵 SECURITY · 10:42 PM</text>
    <text x="28" y="218" font-family="sans-serif" font-size="10.5" fill="#334155">Front door opened</text>

    <rect x="18" y="236" width="274" height="44" rx="8" fill="#F0FDF4" stroke="#BBF7D0" />
    <text x="28" y="254" font-family="sans-serif" font-size="11" font-weight="800" fill="#16A34A">🟢 SYSTEM · 10:30 PM</text>
    <text x="28" y="270" font-family="sans-serif" font-size="10.5" fill="#334155">Security Mode activated</text>
  </g>
</svg>
