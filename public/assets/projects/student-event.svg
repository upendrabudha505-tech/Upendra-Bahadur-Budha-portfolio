<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <!-- Main Dark Navy Background -->
  <rect width="1280" height="720" fill="#071326" />

  <!-- Top White Navbar -->
  <rect x="0" y="0" width="1280" height="90" fill="#FFFFFF" />
  <rect x="18" y="18" width="52" height="52" rx="12" fill="#F1F5F9" stroke="#E2E8F0" />
  <circle cx="44" cy="44" r="16" fill="#0284C7" />
  <text x="82" y="32" font-family="Georgia, serif" font-size="16" font-weight="900" fill="#0F172A">APU</text>
  <text x="82" y="50" font-family="Georgia, serif" font-size="16" font-weight="900" fill="#0F172A">WELLNESS</text>
  <text x="82" y="66" font-family="monospace" font-size="10.5" font-weight="700" fill="#059669">FEST 2026 ·</text>
  <text x="82" y="79" font-family="monospace" font-size="10.5" font-weight="700" fill="#059669">DASHBOARD</text>

  <!-- Active Home Pill -->
  <rect x="182" y="24" width="90" height="42" rx="12" fill="#FFF1F2" />
  <text x="227" y="50" font-family="sans-serif" font-size="14" font-weight="700" fill="#E11D48" text-anchor="middle">🏠 Home</text>

  <text x="306" y="50" font-family="sans-serif" font-size="14" font-weight="600" fill="#334155">About</text>
  <text x="372" y="50" font-family="sans-serif" font-size="14" font-weight="600" fill="#334155">Leadership</text>
  <text x="470" y="50" font-family="sans-serif" font-size="14" font-weight="600" fill="#334155">Schedule</text>
  <text x="556" y="50" font-family="sans-serif" font-size="14" font-weight="600" fill="#334155">Activities</text>
  <text x="646" y="50" font-family="sans-serif" font-size="14" font-weight="600" fill="#334155">Resources</text>
  <text x="742" y="50" font-family="sans-serif" font-size="14" font-weight="600" fill="#334155">Gallery</text>
  <text x="816" y="50" font-family="sans-serif" font-size="14" font-weight="600" fill="#334155">News</text>
  <text x="880" y="50" font-family="sans-serif" font-size="14" font-weight="600" fill="#334155">More ⌄</text>

  <!-- Hero Content Left -->
  <rect x="38" y="168" width="60" height="52" rx="12" fill="#FFFFFF" />
  <circle cx="68" cy="194" r="14" fill="#0284C7" />

  <rect x="114" y="176" width="430" height="36" rx="18" fill="#062E2E" stroke="#10B981" stroke-width="1" />
  <text x="329" y="199" font-family="sans-serif" font-size="13" font-weight="700" fill="#34D399" text-anchor="middle">🤝 University: APU (Malaysia) · College: LBEF Campus (Nepal)</text>

  <text x="38" y="294" font-family="sans-serif" font-size="56" font-weight="900" fill="#FFFFFF">APU Wellness Fest</text>
  <text x="38" y="366" font-family="sans-serif" font-size="58" font-weight="900" fill="#F43F5E">2026</text>

  <text x="38" y="424" font-family="sans-serif" font-size="22" font-weight="700" fill="#10B981">“Move Better. Feel Better. Live Better.”</text>

  <text x="38" y="468" font-family="sans-serif" font-size="17" fill="#CBD5E1">Join 4,500+ students, faculty, and innovators from over 130 countries</text>
  <text x="38" y="496" font-family="sans-serif" font-size="17" fill="#CBD5E1">for 4 transformative days of high-intensity athletics, rooftop yoga,</text>
  <text x="38" y="524" font-family="sans-serif" font-size="17" fill="#CBD5E1">mental resilience hackathons, budget plant-based dining, and our life-</text>
  <text x="38" y="552" font-family="sans-serif" font-size="17" fill="#CBD5E1">saving national blood drive.</text>

  <!-- Action Buttons & Floating Audio Widget -->
  <rect x="38" y="604" width="190" height="52" rx="14" fill="#E11D48" />
  <rect x="304" y="604" width="280" height="52" rx="14" fill="#0A1B33" stroke="#334155" stroke-width="1.5" />
  <text x="444" y="636" font-family="sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">📋 Open Unified Dashboard</text>

  <!-- Floating Zen Ambient Harmony Pill -->
  <rect x="24" y="628" width="336" height="48" rx="24" fill="#FFFFFF" />
  <text x="72" y="648" font-family="sans-serif" font-size="12" font-weight="800" fill="#0F172A">Zen Ambient Harmony</text>
  <text x="72" y="663" font-family="sans-serif" font-size="10.5" fill="#64748B">Paused (Click to Relax)</text>

  <!-- Right Video Player Card -->
  <g transform="translate(656, 330)">
    <rect x="0" y="0" width="584" height="330" rx="20" fill="#0F1E2E" stroke="#1E293B" stroke-width="2" />
    <!-- Gym Floor & Barbell Graphic -->
    <line x1="20" y1="180" x2="564" y2="95" stroke="#94A3B8" stroke-width="10" stroke-linecap="round" />
    <rect x="210" y="88" width="26" height="150" rx="6" fill="#334155" stroke="#64748B" stroke-width="2" />
    <rect x="240" y="96" width="20" height="134" rx="5" fill="#1E293B" stroke="#475569" stroke-width="2" />
    <!-- Video Controls Scrim -->
    <rect x="0" y="250" width="584" height="80" rx="20" fill="#030712" fill-opacity="0.85" />
    <text x="30" y="286" font-family="sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">▶   0:00</text>
    <line x1="28" y1="308" x2="556" y2="308" stroke="#475569" stroke-width="4" stroke-linecap="round" />
    <!-- Video Footer Caption -->
    <text x="16" y="360" font-family="sans-serif" font-size="13" font-weight="700" fill="#F8FAFC">🔴 15-Second Official Action Teaser: <tspan fill="#94A3B8" font-weight="500">Energy &amp; Movement</tspan></text>
    <rect x="460" y="342" width="110" height="26" rx="13" fill="#E11D48" />
    <text x="515" y="359" font-family="sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">🕒 0:15 HD CLIP</text>
  </g>
</svg>
