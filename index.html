      (function () {
        function loadStandaloneReactApp() {
          var root = document.getElementById('root');
          if (
            window.__VITE_APP_MOUNTED__ ||
            (root && (root.getAttribute('data-mounted') === 'true' || root.children.length > 0))
          ) {
            return;
          }
          var s = document.createElement('script');
          s.src = './public/app-bundle.js';
          s.onerror = function () {
            var s2 = document.createElement('script');
            s2.src = './app-bundle.js';
            document.body.appendChild(s2);
          };
          document.body.appendChild(s);
        }

        var host = window.location.hostname || '';
        if (
          window.location.protocol === 'file:' ||
          window.location.port === '5500' ||
          window.location.port === '5501' ||
          host.indexOf('upendrabudha.com.np') !== -1 ||
          host.indexOf('github.io') !== -1
        ) {
          loadStandaloneReactApp();
        } else {
          window.addEventListener('load', function () {
            setTimeout(loadStandaloneReactApp, 450);
          });
        }
      })();
    </script>
