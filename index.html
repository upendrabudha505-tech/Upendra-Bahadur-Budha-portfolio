    <meta charset="UTF-8" />

    <meta name="description" content="Personal academic portfolio of Upendra Bahadur Budha, BSc IT – Cloud Computing student at LBEF College, showcasing academic projects, coursework concepts, and technical skills." />
    <meta property="og:title" content="Upendra Bahadur Budha — BSc IT Cloud Computing Portfolio" />
    <meta property="og:description" content="Personal academic portfolio of Upendra Bahadur Budha, BSc IT – Cloud Computing student at LBEF College, showcasing academic projects, coursework concepts, and technical skills." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./public/app-bundle.css" />
  </head>
  <body class="bg-[#060911] text-slate-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function () {
        function loadStandaloneReactApp() {
          var root = document.getElementById('root');
          if (
            window.__VITE_APP_MOUNTED__ ||
            (root && (root.getAttribute('data-mounted') === 'true' || root.children.length > 0))
          ) {
            return;
          }
          var s = document.createElement('script');
          s.src = './public/app-bundle.js';
          s.onerror = function () {
            var s2 = document.createElement('script');
            s2.src = './app-bundle.js';
            document.body.appendChild(s2);
          };
          document.body.appendChild(s);
        }

        var host = window.location.hostname || '';
        if (
          window.location.protocol === 'file:' ||
          window.location.port === '5500' ||
          window.location.port === '5501' ||
          host.indexOf('upendrabudha.com.np') !== -1 ||
          host.indexOf('github.io') !== -1
        ) {
          loadStandaloneReactApp();
        } else {
          window.addEventListener('load', function () {
            setTimeout(loadStandaloneReactApp, 450);
          });
        }
      })();
    </script>
  </body>
</html>
